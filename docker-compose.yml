# §12.2: بيئة التطوير المحلي. الخدمات نفسها التي تُستخدم مُدارةً في الإنتاج.
name: trend

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: trend_owner
      POSTGRES_PASSWORD: trend_owner
      POSTGRES_DB: trend
      TZ: UTC
    ports: ['5432:5432']
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trend_owner -d trend']
      interval: 5s
      retries: 10

  # §6.4: Redis أو Valkey — للجلسات والحدود والطوابير والوقت الحقيقي.
  valkey:
    image: valkey/valkey:8-alpine
    ports: ['6379:6379']

  # §6.4: تخزين كائنات متوافق مع S3 للمرفقات.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: trend
      MINIO_ROOT_PASSWORD: trend-minio-dev
    ports: ['9000:9000', '9001:9001']
    volumes: [minio-data:/data]

  # بريد محلي لاختبار الدعوات دون إرسال حقيقي.
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['1025:1025', '8025:8025']

volumes:
  pg-data:
  minio-data:
